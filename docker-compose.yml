services:
  train:
    build:
      context: .
      dockerfile: Dockerfile.train
    image: drone-train:cpu
    volumes:
      - ./data:/app/data
      - ./runs:/app/runs
      - ./models:/app/models
      - ./results:/app/results
      - ./configs:/app/configs
      - ./scripts:/app/scripts
      - ./README.md:/app/README.md
    shm_size: "2gb"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: drone-detect-train
      DO_NOT_TRACK: "true"
    depends_on:
      - mlflow

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    image: drone-mlflow:3.16.1
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow:/mlflow

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        MODEL_VERSION: dev
    image: drone-detect-api:dev
    ports:
      - "8000:8000"
    environment:
      CONF: "0.3"
    profiles: ["api"]
